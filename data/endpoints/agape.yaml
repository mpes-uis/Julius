# Agape API endpoints
# URL pattern: {base}/{path}?ano={year}[&mes={month:02d}][&pagina={page}]
# Base URL from prefeituras.csv already includes /api (e.g. https://www.brejetuba.es.gov.br/transparencia/api)
# Response: {"pagina_total": N, "registro_total": M, "registros": [...], ...}
# Page size: 10 records per page. Pagination via &pagina=N.
# Validated against Cachoeiro de Itapemirim on 2026-05-22.

endpoints:
  # Monthly endpoints (significantly different counts with/without mes)
  - name: empenhos
    path: empenhos
    frequency: monthly
    description: Commitments and beneficiaries

  - name: liquidacoes
    path: liquidacoes
    frequency: monthly
    description: Settlements

  - name: pagamentos
    path: pagamentos
    frequency: monthly
    description: Payments

  - name: receitas
    path: receitas
    frequency: monthly
    description: Revenues

  - name: diarias_passagens
    path: diarias_passagens
    frequency: monthly
    description: Daily allowances and travel

  # Yearly endpoints (same count with or without mes)
  - name: servidores
    path: servidores
    frequency: yearly
    description: Public employees — large dataset, may be slow

  - name: contratos
    path: contratos
    frequency: yearly
    description: Contracts

  - name: licitacoes
    path: licitacoes
    frequency: yearly
    description: Bidding processes

  - name: atas
    path: atas
    frequency: yearly
    description: Meeting minutes and commitment terms

  - name: orcamento_receita
    path: orcamento_receita
    frequency: yearly
    description: Revenue budget

  - name: orcamento_despesa
    path: orcamento_despesa
    frequency: yearly
    description: Expense budget

  - name: documentos
    path: documentos
    frequency: yearly
    description: Official documents

  - name: notasfiscais
    path: notasfiscais
    frequency: yearly
    description: Fiscal notes

  - name: auxilio_alimentacao
    path: auxilio_alimentacao
    frequency: yearly
    description: Food allowance

  - name: atos_controle
    path: atos_controle
    frequency: yearly
    description: Internal control acts

  - name: extra
    path: extra
    frequency: yearly
    description: Extra-budgetary transactions
