[project]
name = "julius"
version = "2.0.0-dev"
description = "Automated capture and analysis of Brazilian municipal transparency portal data"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.0",
    "structlog>=24.2",
    "tenacity>=8.3",
    "pyyaml>=6.0",
]

[project.scripts]
julius = "julius.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.setuptools.packages.find]
include = ["julius*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PTH", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
